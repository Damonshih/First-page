<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>我的期中考網站</title>

  <style>
    #main-title
    {
      color: #0000FF;
      padding: 20px;
      background-color: #eee;
    }

    .img-container
    {
      position: relative;
      display: inline-block;
    }

    .floating-text
    {
      position: absolute;
      bottom: 15px;
      right: 15px;

      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
    }
    </style>
</head>
<body>
  <div id="main-title">
    <h1>welcome</h1>
  </div>

  <div class="img-container">
    <img src="city.jpg"  alt="海邊風景" width="500" usemap="#mymap">
    <div class="floating-text">右下角浮動標籤</div>
  </div>
  <map name="mymap">
    <area shape="rect" coords="50,50,200,200" href="page1.html" alt="沙灘">
    <area shape="circle" coords="400,100,50" href="page2.html" alt="海洋">
  </map>

</body>
</html>
